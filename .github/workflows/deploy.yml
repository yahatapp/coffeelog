name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Install pinned Vite+
        run: nix develop --command ./scripts/setup-vp.sh

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Verify release
        run: nix develop --command pnpm run guard:changes

      - name: Audit production dependencies
        run: nix develop --command pnpm audit --prod --audit-level moderate

      - name: Build release
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: nix develop --command pnpm run build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: nix develop --command pnpm run db:migrate

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: nix develop --command pnpm run deploy:built
