name: Deploy Brewlog

on:
  push:
    branches: [main]
    paths:
      - apps/brewlog/**
      - packages/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - flake.nix
      - flake.lock
      - .github/workflows/deploy-brewlog.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-brewlog
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Brewlog production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-brewlog
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Verify and build Brewlog
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
        run: nix develop --command pnpm turbo run check test build --filter=brewlog...

      - name: Audit production dependencies
        run: nix develop --command pnpm audit --prod --audit-level moderate

      - name: Apply Brewlog database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: nix develop --command pnpm --filter brewlog db:migrate

      - name: Deploy Brewlog to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: nix develop --command pnpm --filter brewlog deploy:built
