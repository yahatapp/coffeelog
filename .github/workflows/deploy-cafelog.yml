name: Deploy Cafelog

on:
  push:
    branches: [main]
    paths:
      - apps/cafelog/**
      - packages/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - flake.nix
      - flake.lock
      - .github/workflows/deploy-cafelog.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cafelog
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cafelog production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-cafelog
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Install pinned Vite+
        run: nix develop --command ./scripts/setup-vp.sh

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Verify and build Cafelog
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: nix develop --command pnpm turbo run check test build --filter=cafelog...

      - name: Audit production dependencies
        run: nix develop --command pnpm audit --prod --audit-level moderate

      - name: Apply Cafelog database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: nix develop --command pnpm --filter cafelog db:migrate

      - name: Deploy Cafelog to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
        run: nix develop --command pnpm --filter cafelog deploy:built
