packages:
  - apps/*
  - packages/*

# pnpm is pinned and supplied by the Nix dev shell. Never download and run a
# different package-manager version when the declared version does not match.
pmOnFail: error

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

packageExtensions:
  # LIFF 2.31.2 omits these runtime imports from its published manifests.
  "@liff/extensions@2.31.2":
    dependencies:
      "@liff/use": 2.31.2
  "@liff/iap@2.31.2":
    dependencies:
      "@liff/server-api": 2.31.2

overrides:
  # Keep transitive Node types aligned with the Node.js 26 runtime in flake.nix.
  "@types/node": 26.6.6
  # Drizzle Kit's legacy loader pins an esbuild with unsafe dev-server CORS.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5

catalog:
  "@base-ui/react": 1.9.0
  "@cloudflare/vite-plugin": 1.67.0
  "@cloudflare/workers-types": 5.20261106.1
  "@hono/zod-validator": 0.9.1
  "@line/liff": 2.31.2
  "@playwright/test": 1.65.0
  "@radix-ui/react-slot": 1.5.0
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.107.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  base-ui: 0.0.294
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  hono: 4.13.16
  jose: 6.2.15
  lefthook: 2.2.2
  lucide-react: 1.70.0
  postgres: 4.1.0
  postcss: 8.5.32
  react: 19.3.1
  react-dom: 19.3.1
  react-icons: 5.7.0
  react-router-dom: 7.18.5
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.1.0
  wrangler: 4.158.0
  zod: 4.6.7
