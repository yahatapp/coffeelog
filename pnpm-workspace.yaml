packages:
  - apps/*
  - packages/*

# pnpm is pinned and supplied by the Nix dev shell. Never download and run a
# different package-manager version when the declared version does not match.
pmOnFail: error

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

peerDependencyRules:
  allowedVersions:
    tailwindcss: "4"

catalog:
  "@cloudflare/vite-plugin": 1.54.4
  "@cloudflare/workers-types": 5.20260903.1
  "@hono/zod-validator": 0.9.1
  "@line/liff": 2.31.0
  "@playwright/test": 1.62.1
  "@radix-ui/react-slot": 1.3.3
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.102.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  "@vitejs/plugin-react": 6.1.1
  autoprefixer: 10.5.4
  base-ui: 0.0.294
  clsx: 2.1.1
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  hono: 4.13.5
  jose: 6.2.10
  lefthook: 2.1.12
  lucide-react: 1.40.0
  postgres: 3.4.9
  postcss: 8.5.28
