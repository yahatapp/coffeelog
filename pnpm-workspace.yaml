packages:
  - apps/*
  - packages/*

# pnpm is pinned and supplied by the Nix dev shell. Never download and run a
# different package-manager version when the declared version does not match.
pmOnFail: error

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

peerDependencyRules:
  allowedVersions:
    tailwindcss: "4"

packageExtensions:
  # LIFF 2.31.2 omits these runtime imports from its published manifests.
  "@liff/extensions@2.31.2":
    dependencies:
      "@liff/use": 2.31.2
  "@liff/iap@2.31.2":
    dependencies:
      "@liff/server-api": 2.31.2

overrides:
  # Keep transitive Node types aligned with the Node.js 24 runtime in flake.nix.
  "@types/node": 24.13.3
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

catalog:
  "@base-ui/react": 1.9.0
  "@cloudflare/vite-plugin": 1.64.0
  "@cloudflare/workers-types": 5.20261022.1
  "@hono/zod-validator": 0.9.1
  "@line/liff": 2.31.2
  "@playwright/test": 1.64.1
  "@radix-ui/react-slot": 1.5.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.104.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  autoprefixer: 10.6.1
  base-ui: 0.0.294
  clsx: 2.1.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  hono: 4.13.13
  jose: 6.2.13
  lefthook: 2.2.2
  lucide-react: 1.61.0
  postgres: 3.4.9
  postcss: 8.5.31
  react: 19.3.1
  react-dom: 19.3.1
  react-icons: 5.7.0
  react-router-dom: 7.18.4
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tailwindcss-animate: 1.0.7
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  wrangler: 4.152.0
  zod: 4.6.7
